[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msld"
version = "1.0.0"
description = "Multiscale Poisson latent-distance model with coordinates shared across observation channels"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Coby Viner"}, {name = "Junhyong Kim"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/cviner/multiscale-latent-distance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
